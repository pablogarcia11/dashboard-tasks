{% from "_macros.html" import copy_button %}
<div id="standup-body">
  {% if error %}<p class="notice error">No se pudo generar: {{ error }}<span class="hint">{{ claude_hint }}</span></p>{% endif %}
  {% if text %}
  <textarea id="standup-text" rows="18" spellcheck="false" aria-label="Texto del stand-up" data-guard>{{ text }}</textarea>
  {% endif %}
  <div class="actions">
    {% if text %}
    {{ copy_button("standup-text") }}
    {% endif %}
    <button type="button" class="btn ghost" hx-post="/standup/{{ day.isoformat() }}?force=true" hx-target="#standup-body"
            hx-swap="outerHTML" hx-indicator="#regen" hx-disabled-elt="this">{% if text %}Regenerar{% else %}Generar stand-up{% endif %}</button>
    <span id="regen" class="htmx-indicator muted">Redactando con Claude…</span>
  </div>
</div>
