<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <script>
    // Tema antes de pintar (sin parpadeo): elección guardada o, si no hay, la del sistema
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) {}
      var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;800&display=swap">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <header class="appbar">
    <div class="wrap appbar-inner">
      <a class="brand" href="/">
        {% if has_logo %}<img src="/static/logo.png" alt="1MillionBot">{% endif %}
        <span class="brand-text">Dashboard</span>
      </a>
      <nav class="appnav">
        <a href="/" {% if section == "day" %}aria-current="page"{% endif %}>Día</a>
        <a href="/timesheet" {% if section == "timesheet" %}aria-current="page"{% endif %}>Parte de horas</a>
        <button type="button" class="theme-toggle" role="switch" id="theme-toggle"
                aria-label="Modo oscuro" title="Cambiar entre modo claro y oscuro">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <a class="icon-link" href="/settings" title="Ajustes" aria-label="Ajustes"
           {% if section == "settings" %}aria-current="page"{% endif %}>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>
  <script>
    (function () {
      var root = document.documentElement, btn = document.getElementById("theme-toggle");
      var sync = function () { btn.setAttribute("aria-checked", root.dataset.theme === "dark"); };
      // Cambio de tema con fundido suave: View Transitions si existe; si no, transición de colores
      var setTheme = function (theme) {
        var apply = function () { root.dataset.theme = theme; sync(); };
        if (document.startViewTransition) { document.startViewTransition(apply); return; }
        root.classList.add("theme-fading");
        apply();
        setTimeout(function () { root.classList.remove("theme-fading"); }, 400);
      };
      sync();
      btn.addEventListener("click", function () {
        var theme = root.dataset.theme === "dark" ? "light" : "dark";
        try { localStorage.setItem("theme", theme); } catch (e) {}
        setTheme(theme);
      });
      // Sin elección guardada, sigue al sistema también en caliente
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (err) {}
        if (!saved) setTheme(e.matches ? "dark" : "light");
      });
    })();

    // Botones "Copiar" (_macros.html): copian el texto de un campo, el icono pasa a ✓ y se anuncia
    function copyFrom(id, btn) {
      navigator.clipboard.writeText(document.getElementById(id).value).then(function () {
        var label = btn.querySelector(".label");
        btn.classList.add("is-copied");
        label.textContent = "Copiado";
        announce("Copiado al portapapeles");
        clearTimeout(btn._reset);
        btn._reset = setTimeout(function () { btn.classList.remove("is-copied"); label.textContent = "Copiar"; }, 1600);
      });
    }

    // Mensajes para lectores de pantalla (región role="status")
    function announce(text) {
      var region = document.getElementById("sr-status");
      region.textContent = "";
      setTimeout(function () { region.textContent = text; }, 50);
    }
  </script>
</body>
</html>
