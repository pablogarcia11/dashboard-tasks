{# Botón "Copiar" solo con icono (documentos superpuestos a dos tonos); al copiar pasa a un círculo con ✓.
   Sin texto visible: el nombre accesible y el tooltip van en aria-label/title (ver copyFrom en base.html). #}
{% macro copy_button(target_id, small=False) -%}
<button type="button" class="btn btn-copy{% if small %} small{% endif %}" onclick="copyFrom('{{ target_id }}', this)"
        aria-label="Copiar" title="Copiar">
  <svg class="i-copy" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="8.5" y="2" width="13" height="15" rx="2.5" fill="currentColor" opacity=".35"/>
    <rect x="3" y="7" width="13" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M6.5 12.5h6M6.5 16.5h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <svg class="i-check" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="10" fill="currentColor" opacity=".3"/>
    <path d="m7.5 12.5 3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>
{%- endmacro %}
