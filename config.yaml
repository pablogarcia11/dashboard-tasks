# Configuración del dashboard personal. Sin secretos: los tokens van en .env.

user:
  # El nombre de la cabecera no se configura: sale de git (user.name global) o de Notion (core/identity.py)
  github: pablogarcia11
  timezone: Europe/Madrid
  # Los emails de autor de git se detectan solos (git config); se pueden añadir más en Ajustes

schedule:
  standup_time: "08:30"     # solo lunes a viernes
  weekend_view: last_friday # en fin de semana, "Hoy" muestra el último viernes con aviso
  holidays: []              # fechas YYYY-MM-DD no laborables

timesheet:                  # parte de horas para 1million hub (aproximado)
  day_start: "08:30"
  day_end: "17:30"
  lunch_start: "14:00"
  lunch_end: "15:00"
  min_block_minutes: 15     # duración estimada por los commits; tarea mínima 15 min
  block_step_minutes: 15    # duraciones en múltiplos de 15 (15, 30, 45, 1 h, 1 h 15…)
  min_daily_hours: 8
  categories:
    - Desarrollo de negocio
    - Reunión
    - Documentación
    - Tareas administrativas
    - Formación

# La página diario y la carpeta de repos de cada persona se eligen en Ajustes (se guardan en db/).
# El usuario de Notion sale de la propia conexión OAuth.
notion:
  tasks_database_id: b92ea782-b911-4e74-b4d2-0998a47c343e
  redirect_uri: http://localhost:8765/oauth/notion/callback
  tasks_person_property: Persona Responsable
  tasks_inactive_statuses: [Done, Archived]

git:
  scan_depth: 3
  # Qué repos se muestran se decide en Ajustes (interruptor "Visible"). El propio dashboard nunca se recoge.

# Proyecto = encabezado 3 del diario. Rutas relativas a la carpeta de repos; una carpeta incluye sus repos anidados.
# Un repo sin mapear toma como proyecto el nombre de su carpeta de primer nivel.
projects:
  AI Risk: [airisk-api, airisk-api-cdu, airisk-api-roles, airiskmanagement, airiskmanagement-roles]
  Kit migración: [boilerplate-api, migration-boilerplate-api]
  Aurea: [aurea]
  IBH: [ibh]
  Millie: [millie]
  Rec Aéreas: [rec-aereas]
  # Reuniones de empresa (Sprint Review, Monthly Review...) sin proyecto concreto
  1MB: []
company_meetings_project: 1MB
# Proyecto de una reunión de Calendar según palabras de su título; si no encaja, va a 1MB
meeting_keywords:
  AI Risk: [ai risk, airisk, oia]
  Kit migración: [migración, migracion, kit]

# Stand-up: canal del equipo (cada persona puede cambiarlo en Ajustes). El formato se aprende de sus
# últimos stand-ups en el canal (conector de Slack de Claude, solo lectura).
standup:
  channel: equipo-tecnologia-stand-up
  examples: 3          # cuántos stand-ups suyos se usan como ejemplo
  relearn_days: 7      # cada cuánto se vuelven a leer

claude:
  command: claude   # ruta absoluta si el programador de tareas no lo encuentra en el PATH
  model: sonnet
  timeout_seconds: 300

sources:
  git: { enabled: true }
  notion: { enabled: true }
  gcal: { enabled: true, via: claude_connector }
  github: { enabled: false }

server:
  host: 127.0.0.1
  port: 8765
