# Configuración del dashboard personal. Sin secretos: los tokens van en .env.

user:
  # El nombre de la cabecera no se configura: sale de git (user.name global) o de Notion (core/identity.py)
  timezone: Europe/Madrid
  # Los emails de autor de git se detectan solos (git config); se pueden añadir más en Ajustes

schedule:
  holidays: []              # fechas YYYY-MM-DD no laborables

timesheet:                  # parte de horas para 1million hub (aproximado)
  day_start: "08:30"
  day_end: "17:30"
  lunch_start: "14:00"
  lunch_end: "15:00"
  min_block_minutes: 15     # duración estimada por los commits; tarea mínima 15 min
  block_step_minutes: 15    # duraciones en múltiplos de 15 (15, 30, 45, 1 h, 1 h 15…)
  min_daily_hours: 8
  categories:
    - Desarrollo de negocio
    - Reunión
    - Documentación
    - Tareas administrativas
    - Formación

# La página diario y la carpeta de repos de cada persona se eligen en Ajustes (se guardan en db/).
# El usuario de Notion sale de la propia conexión OAuth. La base de datos de tareas va en .env
# (NOTION_TASKS_DATABASE_ID), junto con las credenciales de la conexión.
notion:
  redirect_uri: http://localhost:8765/oauth/notion/callback
  tasks_person_property: Persona Responsable
  tasks_inactive_statuses: [Done, Archived]

git:
  scan_depth: 3
  # Qué repos se muestran se decide en Ajustes (interruptor "Visible"). El propio dashboard nunca se recoge.

# Proyectos de la empresa (= encabezados del diario) según el nombre de los repos. Cada patrón se compara
# con el nombre del repo y con el de las carpetas que lo contienen, así que no depende de dónde tenga cada
# persona sus repos; admite comodines (airisk*). Los worktrees heredan el proyecto de su repo principal.
# Un repo que no encaje toma como proyecto el nombre de su carpeta de primer nivel.
projects:
  AI Risk: ["airisk*"]                                 # airisk-api, airiskmanagement…
  Kit migración: [boilerplate-api, migration-boilerplate-api]
  Aurea: ["aurea*"]                                    # aurea-1mb, aurea-api
  IBH: [ibh, "ibh-*"]                                  # todo lo que esté en una carpeta ibh
  Millie: [millie, apiREST]                            # apiREST, dashboard… dentro de millie
  Rec Aéreas: [rec-aereas, "juridocraft*"]
  # Reuniones de empresa (Sprint Review, Monthly Review...) sin proyecto concreto
  1MB: []
company_meetings_project: 1MB
# Proyecto de una reunión de Calendar según palabras de su título; si no encaja, va a 1MB
meeting_keywords:
  AI Risk: [ai risk, airisk, oia]
  Kit migración: [migración, migracion, kit]

# Stand-up: cada persona elige su canal en Ajustes. El formato se aprende de sus últimos stand-ups
# en ese canal (conector de Slack de Claude, solo lectura).
standup:
  examples: 3          # cuántos stand-ups suyos se usan como ejemplo
  relearn_days: 7      # cada cuánto se vuelven a leer

claude:
  command: claude   # ruta absoluta si no está en el PATH
  model: sonnet
  timeout_seconds: 300

sources:
  git: { enabled: true }
  notion: { enabled: true }
  gcal: { enabled: true, via: claude_connector }

server:
  auto_refresh_minutes: 10   # con la vista de hoy abierta, relee diario y commits cada tantos minutos (0 = nunca)
  host: 127.0.0.1
  port: 8765
